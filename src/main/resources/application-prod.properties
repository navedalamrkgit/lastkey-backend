# =====================================================
# PRODUCTION DATABASE
# =====================================================

# Render/Neon environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# DATABASE CONNECTION POOL
# =====================================================

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=LastKeyHikariPool

# =====================================================
# JPA / HIBERNATE
# =====================================================

# First deployment par tables automatically create/update hongi.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================================================
# PRODUCTION SECURITY
# =====================================================

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# =====================================================
# LOGGING
# =====================================================

logging.level.root=INFO
logging.level.com.lastkey.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
# =====================================================
# CORS CONFIGURATION
# =====================================================

app.cors.allowed-origins[0]=http://localhost:5173
app.cors.allowed-origins[1]=http://127.0.0.1:5173
app.cors.allowed-origins[2]=https://lastkey-frontend.vercel.app

app.cors.allowed-methods[0]=GET
app.cors.allowed-methods[1]=POST
app.cors.allowed-methods[2]=PUT
app.cors.allowed-methods[3]=PATCH
app.cors.allowed-methods[4]=DELETE
app.cors.allowed-methods[5]=OPTIONS

app.cors.allowed-headers[0]=Authorization
app.cors.allowed-headers[1]=Content-Type
app.cors.allowed-headers[2]=Accept
app.cors.allowed-headers[3]=Origin
app.cors.allowed-headers[4]=X-Requested-With

app.cors.exposed-headers[0]=Authorization

app.cors.allow-credentials=true
app.cors.max-age=3600